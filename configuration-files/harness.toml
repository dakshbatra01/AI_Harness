# Harness runtime configuration. Environment variables override these values
# (AI_MODEL, AI_PROVIDER, AI_BASE_URL, AI_TOOL_MODE, HARNESS__<SECTION>__<KEY>=value).
# The API key is NEVER stored here: it is read from AI_API_KEY at runtime only.

# ============================== MODEL CONFIGURATION ==============================
# The model used for evaluation is defined here. If the Organising Committee prescribes a model,
# put its exact id in `name` (or export AI_MODEL=<id>); the harness never substitutes another model.
# When `name` is empty, the provider's default listed in source-code/harness/provider/__init__.py is used and a
# warning is printed. The effective model is printed at startup and recorded in every result.json.
# ==================================================================================
[model]
name = ""
# auto | anthropic | openai | gemini | groq | deepseek | openrouter | qwen | openai_compatible
# For Groq GPT-OSS 120B: AI_PROVIDER=groq AI_MODEL=openai/gpt-oss-120b make run
# For DeepSeek Flash: AI_PROVIDER=deepseek AI_MODEL=deepseek-flash make run
# For OpenRouter DeepSeek: AI_PROVIDER=openrouter AI_MODEL=deepseek/deepseek-v4.1-flash make run
# For Qwen Model Studio: AI_PROVIDER=qwen AI_MODEL=<model-id> AI_BASE_URL=<key-region-endpoint> make run
# Use the exact organizer model ID once announced; AI_API_KEY remains only in the environment.
provider = "auto"
# Optional custom endpoint (OpenAI-compatible gateways, proxies). Empty = provider default.
base_url = ""
# Deterministic decoding where the model supports it (ignored/auto-dropped by models that reject it).
temperature = 0.0
seed = 7
max_output_tokens = 16000
context_window = 200000
# auto: native tool calling, falling back to the text protocol if the endpoint rejects tools.
tool_mode = "auto"
request_timeout_s = 600
max_retries = 5
prompt_caching = true
# Anthropic output_config.effort for models that support it ("" = omit).
effort = "high"
# auto: mask old observations except for Anthropic (whose newest models require append-only history).
mask_observations = "auto"

[budget]
max_steps = 100
max_model_calls = 120
max_total_tokens = 6000000
max_wall_s = 3000
# Fraction of every budget reserved for final verification.
verification_reserve = 0.2
# Fresh-context attempts (L1). The best verified candidate is kept, never simply the latest.
max_attempts = 2
max_verify_rounds = 4

[tools]
cmd_timeout_s = 180
test_timeout_s = 900
obs_head_chars = 5000
obs_tail_chars = 5000
search_max_hits = 60
read_window_lines = 100
keep_full_observations = 6
max_actions_per_turn = 6
# full: structured tool interface | bash: shell + submit only (for A/B comparisons; same verifier)
profile = "full"

[verify]
# auto: run the full suite when it is small or the route is STRUCTURED.
full_suite = "auto"
full_suite_timeout_s = 1200
max_test_files_for_auto_full = 40
related_test_limit = 6
flaky_reruns = 1
# Self-review: the first submit of a new patch shows the full diff + a checklist, then verification runs.
review_on_submit = true

[context]
# Issue-ranked code map shown at the start (saves exploration turns). auto = only for repos with
# at least codemap_min_files source files; bounded by a token budget and a build-time cap.
codemap = "auto"
codemap_tokens = 1200
codemap_min_files = 15
codemap_time_s = 8
codemap_max_files = 6000

[loop]
# Stuck-detector thresholds (consecutive repeats before the controller intervenes).
same_action_same_obs = 4
same_action_error = 3
no_action_msgs = 3
ping_pong = 6
same_failure_signature = 3
locate_nudge_steps = 14
edit_without_check_nudge = 3

[run]
runs_dir = "runs"
# false: `make run` exits 0 whenever the harness completed (status is in result.json).
strict_exit_code = false
keep_scratch = false

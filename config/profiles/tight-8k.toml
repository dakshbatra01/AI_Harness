# Profile for endpoints with a tiny per-request/per-minute token allowance (e.g. free tiers with
# 8k tokens-per-minute). Same harness, tighter context management:
#   HARNESS_CONFIG=config/profiles/tight-8k.toml make run ...
[model]
name = "openai/gpt-oss-120b"
provider = "auto"
temperature = 0.0
seed = 7
max_output_tokens = 2500
context_window = 7200          # request budget: history is masked/compacted to stay under it
tool_mode = "auto"
request_timeout_s = 300
max_retries = 8
tpm_limit = 7800

[budget]
max_steps = 60
max_model_calls = 70
max_total_tokens = 600000
max_wall_s = 2400
verification_reserve = 0.2
max_attempts = 2
max_verify_rounds = 3

[tools]
cmd_timeout_s = 180
test_timeout_s = 600
obs_head_chars = 1800
obs_tail_chars = 1400
search_max_hits = 25
read_window_lines = 70
keep_full_observations = 3
max_actions_per_turn = 4

[context]
codemap = "auto"
codemap_tokens = 500
codemap_min_files = 15
